<!DOCTYPE HTML>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Ticket Generator</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset=utf-8/>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.3.2/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" media="screen" href="/assets/css/style.css"/>
    <script type="text/javascript" src="/assets/js/script.js"></script>
    <style>
        .tickets-header-link { font-size:14px; }
        .tickets-actions { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; }
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body { height: auto; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            /* Scale content slightly so up to 6 tickets fit on one page */
            #printRoot { transform: scale(0.85); transform-origin: top center; }
            /* Avoid accidental page breaks inside tickets */
            #BigTable, #BigTable tr, #BigTable td, .innerTable { page-break-inside: avoid; break-inside: avoid; }
        }
    </style>
    
    
    
    
    
    
    
    
    
</head>
<body>
<h1 align="center">Get Ready, [[${name}]] !</h1>
<div style="text-align:center; margin:8px 0 16px;">
    <a class="tickets-header-link no-print dividends-link" href="/dividends" target="_blank" rel="noopener">Learn about dividends</a>
</div>

<!-- Action buttons: Clear and Download PDF -->
<div class="tickets-actions no-print">
    <button id="clearCrosses" style="padding:6px 10px; cursor:pointer;">Clear</button>
    <a th:href="@{'/generate-tickets.pdf'(code=${code})}"
       style="padding:6px 10px; cursor:pointer; display:inline-block; text-decoration:none; border:1px solid #333; background:#f5f5f5; color:#000;">Download PDF</a>
    <a th:href="@{'/generate-tickets.png'(code=${code})}"
       style="padding:6px 10px; cursor:pointer; display:inline-block; text-decoration:none; border:1px solid #333; background:#f5f5f5; color:#000;">Download PNG</a>
    <a th:href="@{'/tickets-print'(code=${code})}"
       style="padding:6px 10px; cursor:pointer; display:inline-block; text-decoration:none; border:1px solid #333; background:#dff5ff; color:#000;">Open Print View</a>
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
</div>

<div id="printRoot">
    <table id="BigTable">
        <tr th:each="ticket : ${tickets}">
            <td>
                <span class="ticket-number">Ticket #[[${ticket.id}]]</span>
                <div>
                    <!-- Attach ticket id so JS can associate crossed numbers per ticket -->
                    <table class="innerTable" th:attr="data-ticket-id=${ticket.id}">
                        <tr th:each="row : ${ticket.numbers}">
                            <!-- Add a semantic class and keep click-target on td.number; store the cell value as data-number on span -->
                            <td th:each="cell : ${row}" th:classappend="${cell}!=0 ? number">
                                <span th:text="${cell}" class="diag1 ticket-cell" th:if="${cell}!=0" th:attr="data-number=${cell}"></span>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
    </table>
    </div>
</body>
</html>
