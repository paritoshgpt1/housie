<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · Players</title>
    <div th:replace="admin/fragments :: head"></div>
</head>
<body class="bg-light admin">
<div class="container-fluid admin-container">
    <div class="admin-layout">
        <div th:replace="admin/fragments :: sidebar('players')"></div>
        <main id="adminMain" role="main" class="admin-main px-4 py-4">
            <div class="d-flex align-items-center mb-3">
                <h3 class="mb-0">Players</h3>
                <form class="form-inline ml-auto" method="get" action="/admin/players">
                    <input class="form-control form-control-sm mr-2" type="text" name="q" placeholder="Search name..." th:value="${q}">
                    <input type="hidden" name="size" th:value="${page.size}">
                    <button class="btn btn-sm btn-outline-primary" type="submit">Search</button>
                    <a class="btn btn-sm btn-link ml-2" href="/admin/players">Reset</a>
                </form>
            </div>
            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th style="width:10%">ID</th>
                                <th style="width:35%">Name</th>
                                <th style="width:25%">Code</th>
                                <th style="width:15%">Tickets</th>
                                <th style="width:15%">Created</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${items}">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.name}"></td>
                                <td><code th:text="${p.code}"></code></td>
                                <td th:text="${p.tickets}"></td>
                                <td th:text="${#dates.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="text-center p-4">No players</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <nav th:if="${page.totalPages} > 1">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${page.first}? 'disabled'">
                            <a class="page-link" th:href="@{'/admin/players'(page=${page.number-1},size=${page.size},q=${q})}">Prev</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
                            th:classappend="${i}==${page.number} ? 'active'">
                            <a class="page-link" th:text="${i+1}"
                               th:href="@{'/admin/players'(page=${i},size=${page.size},q=${q})}"></a>
                        </li>
                        <li class="page-item" th:classappend="${page.last}? 'disabled'">
                            <a class="page-link" th:href="@{'/admin/players'(page=${page.number+1},size=${page.size},q=${q})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
    </div>
<div th:replace="admin/fragments :: scripts"></div>
</body>
<!-- Filter by name performs case-insensitive contains search (ILIKE). -->
</html>
