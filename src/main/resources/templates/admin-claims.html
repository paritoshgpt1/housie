<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · Claims</title>
    <div th:replace="admin/fragments :: head"></div>
</head>
<body class="bg-light admin">
<div class="container-fluid admin-container">
    <div class="admin-layout">
        <div th:replace="admin/fragments :: sidebar('claims')"></div>
        <main id="adminMain" role="main" class="admin-main px-4 py-4">
            <div class="d-flex align-items-center mb-3">
                <h3 class="mb-0">Claims</h3>
            </div>
            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th style="width:10%">ID</th>
                                <th style="width:12%">Ticket #</th>
                                <th style="width:12%">Round #</th>
                                <th style="width:35%">Name</th>
                                <th style="width:15%">Factor</th>
                                <th style="width:25%">Created</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${items}">
                                <td th:text="${c.id}"></td>
                                <td th:text="${c.ticket != null ? c.ticket.id : ''}"></td>
                                <td th:text="${c.round != null ? c.round.id : ''}"></td>
                                <td th:text="${c.name}"></td>
                                <td th:text="${c.factor}"></td>
                                <td th:text="${#dates.format(c.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="text-center p-4">No claims</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <nav th:if="${page.totalPages} > 1">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${page.first}? 'disabled'">
                            <a class="page-link" th:href="@{'/admin/claims'(page=${page.number-1},size=${page.size})}">Prev</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
                            th:classappend="${i}==${page.number} ? 'active'">
                            <a class="page-link" th:text="${i+1}"
                               th:href="@{'/admin/claims'(page=${i},size=${page.size})}"></a>
                        </li>
                        <li class="page-item" th:classappend="${page.last}? 'disabled'">
                            <a class="page-link" th:href="@{'/admin/claims'(page=${page.number+1},size=${page.size})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
    </div>
<div th:replace="admin/fragments :: scripts"></div>
</body>
</html>
