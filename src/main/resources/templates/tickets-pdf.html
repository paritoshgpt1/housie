<!DOCTYPE HTML>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8"/>
    <title>Housie Tickets</title>
    <style>
        /* Inline critical CSS to match on-screen layout */
        body { font-family: Arial, sans-serif; color: #333; margin: 0; }
        .pdf-title { text-align: center; color: #222; font-weight: bold; font-size: 14px; padding: 2px 0; margin: 0 0 4px 0; page-break-inside: avoid; page-break-after: avoid; break-inside: avoid; break-after: avoid; }
        .ticket-number { font-size: 16px; display:block; margin: 0; }
        #BigTable { padding:0; text-align:center; border:2px solid #000; border-collapse:separate; border-spacing: 5px; margin-left:auto; margin-right:auto; margin-top: 0; margin-bottom: 0; }
        .innerTable { table-layout: fixed; width:auto; margin: 0 auto; }
        td { font-family: Arial, sans-serif; table-layout: fixed; color:#333; padding:2px; width:28px; height:22px; text-align:center; border:3px solid #9fa1df; font-size:20px; background-color:#eee; }
        .player-tickets { width:100%; }
        .player-tickets td { font-size:13px; }
        /* Fit up to 6 tickets on one A4 page */
        @page { size: A4 portrait; margin: 6mm; }
        /* Uniformly scale entire content to maintain aspect ratio (fixed defaults) */
        #printRoot {
            transform: scale(1.1);
            transform-origin: top center;
            margin: 0 auto;
            page-break-inside: avoid;
            page-break-before: avoid;
            page-break-after: avoid;
            display: block;
            padding-bottom: 0;
        }
        #BigTable, #BigTable tr, #BigTable td, .innerTable { page-break-inside: avoid; break-inside: avoid; }
    </style>
</head>
<body>
<div id="printRoot">
    <div class="pdf-title">[[${name}]]</div>
    <table id="BigTable">
        <!-- Single column: each ticket in its own row -->
        <tr th:each="ticket : ${tickets}">
            <td>
                <span class="ticket-number">Ticket #[[${ticket.id}]]</span>
                <div>
                    <table class="innerTable" th:attr="data-ticket-id=${ticket.id}">
                        <tr th:each="row : ${ticket.numbers}">
                            <td th:each="cell : ${row}" th:classappend="${cell}!=0 ? number">
                                <span th:text="${cell}" th:if="${cell}!=0"></span>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
