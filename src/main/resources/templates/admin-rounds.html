<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · Rounds</title>
    <div th:replace="admin/fragments :: head"></div>
    <style>
        .numbers-preview { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .numbers-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.8rem; }
        .table thead th { position: sticky; top: 0; z-index: 1; }
    </style>
</head>
<body class="bg-light admin">
<div class="container-fluid admin-container">
    <div class="admin-layout">
        <div th:replace="admin/fragments :: sidebar('rounds')"></div>
        <main id="adminMain" role="main" class="admin-main px-4 py-4">
            <div class="d-flex align-items-center mb-3">
                <h3 class="mb-0">Rounds</h3>
            </div>
            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th style="width:8%">ID</th>
                                <th style="width:10%">Status</th>
                                <th style="width:44%">Numbers (preview)</th>
                                <th style="width:16%">Created</th>
                                <th style="width:16%">Updated</th>
                                <th style="width:6%" class="text-right pr-3">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${items}">
                                <td th:text="${r.id}"></td>
                                <td>
                                    <span th:if="${r.numbers} == null" class="badge badge-warning">In progress</span>
                                    <span th:if="${r.numbers} != null" class="badge badge-success">Completed</span>
                                </td>
                                <td>
                                    <div class="numbers-preview">
                                        <code class="numbers-code text-muted" th:if="${r.numbers} == null">(in-progress)</code>
                                        <code class="numbers-code" th:if="${r.numbers} != null" th:text="${r.numbers}"></code>
                                    </div>
                                </td>
                                <td th:text="${#dates.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${#dates.format(r.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td class="text-right pr-3">
                                    <button class="btn btn-sm btn-outline-secondary" th:disabled="${r.numbers} == null"
                                            data-toggle="modal" data-target="#numbersModal"
                                            th:attr="data-full=${r.numbers}">View</button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(items)}"><td colspan="4" class="text-center p-4">No rounds</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <nav th:if="${page.totalPages} > 1">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${page.first}? 'disabled'">
                            <a class="page-link" th:href="@{'/admin/rounds'(page=${page.number-1},size=${page.size})}">Prev</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
                            th:classappend="${i}==${page.number} ? 'active'">
                            <a class="page-link" th:text="${i+1}"
                               th:href="@{'/admin/rounds'(page=${i},size=${page.size})}"></a>
                        </li>
                        <li class="page-item" th:classappend="${page.last}? 'disabled'">
                            <a class="page-link" th:href="@{'/admin/rounds'(page=${page.number+1},size=${page.size})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
    </div>
<div th:replace="admin/fragments :: scripts"></div>
<!-- Full numbers modal -->
<div class="modal fade" id="numbersModal" tabindex="-1" role="dialog" aria-labelledby="numbersModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="numbersModalLabel">Round Numbers</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <pre id="numbersFull" class="numbers-code mb-0" style="white-space: pre-wrap; word-wrap: break-word; max-height: 60vh; overflow:auto;"></pre>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" id="copyNumbersBtn">Copy</button>
        <button type="button" class="btn btn-sm btn-primary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function(){
    $(document).on('show.bs.modal', '#numbersModal', function (e) {
      var button = $(e.relatedTarget);
      var full = button.data('full') || '';
      $('#numbersFull').text(full);
    });
    $(document).on('click', '#copyNumbersBtn', function(){
      var text = $('#numbersFull').text();
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
    });
  })();
  </script>
</body>
</html>
