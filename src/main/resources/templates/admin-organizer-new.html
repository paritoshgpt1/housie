<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · New Organizer</title>
    <div th:replace="admin/fragments :: head"></div>
    <meta name="robots" content="noindex,nofollow">
</head>
<body class="bg-light admin">
<div class="container-fluid admin-container">
    <div class="admin-layout">
        <!-- Sidebar -->
        <div th:replace="admin/fragments :: sidebar('organizers')"></div>

        <!-- Main content -->
        <main id="adminMain" role="main" class="admin-main px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="d-inline-block mb-0">Create New Organizer</h3>
            </div>

            <div>
                <div th:if="${error}" class="alert alert-danger" role="alert">[[${error}]]</div>
                <div th:if="${success}" class="alert alert-success" role="alert">[[${success}]]</div>
            </div>

            <div class="card">
                <div class="card-body">
                    <form action="/admin/organizers" method="post">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input class="form-control" id="name" name="name" placeholder="Organizer Name" th:value="${organizer.name}">
                        </div>
                        <div class="form-group">
                            <label for="code">Code</label>
                            <input class="form-control" id="code" name="code" placeholder="Unique code (a-z,0-9)" th:value="${organizer.code}">
                            <small class="form-text text-muted">Will be lowercased and must be unique.</small>
                        </div>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </form>
    </div>
</div>

            <div class="mt-4" th:if="${createdOrganizer}">
                <h5>Created</h5>
                <pre class="bg-white p-3 border"><code>Name: [[${createdOrganizer.name}]]
Code: [[${createdOrganizer.code}]]
Id: [[${createdOrganizer.id}]]</code></pre>
            </div>
        </main>
    </div>
    
</div>
<div th:replace="admin/fragments :: scripts"></div>
</body>
</html>
