## Database (env-driven; defaults to in-memory H2 for local dev)
# Prefer SPRING_DATASOURCE_* if provided; fallback to JDBC_DATABASE_*; else H2
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:h2:mem:housie}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${JDBC_DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${JDBC_DATABASE_PASSWORD:}}
spring.jpa.show-sql=true

## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

# Schema update strategy (override via SPRING_JPA_HIBERNATE_DDL_AUTO)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# These can be overridden via environment variables in hosting
custom.scheme=${CUSTOM_SCHEME:https}
server.port=${PORT:8080}
custom.host=${CUSTOM_HOST:localhost:8080}

# Basic auth for admin endpoints
security.admin.username=${ADMIN_USER:admin}
security.admin.password=${ADMIN_PASS:rootuser}
