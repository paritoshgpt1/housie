services:
  - type: web
    name: housie
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      # Database (set these in Render dashboard or when deploying the Blueprint)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Hibernate schema management
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # App URL used for generating ticket links
      - key: CUSTOM_SCHEME
        value: https
      - key: CUSTOM_HOST
        sync: false  # e.g. your-service.onrender.com
